[window]
padding.x = 16
padding.y = 12
decorations = "none"
opacity = 0.90
blur = true
startup_mode = "Windowed"

[font]
normal.family = "JetBrains Mono"
normal.style = "Regular"
bold.style = "Bold"
italic.style = "Italic"
size = 12.0

[cursor]
style.shape = "Beam"
style.blinking = "On"
blink_interval = 500

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[colors.cursor]
cursor = "#cba6f7"
text   = "#1e1e2e"

[colors.selection]
background = "#313244"
text       = "#cdd6f4"

[keyboard]
bindings = [
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
]
