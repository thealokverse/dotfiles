[colors]
base        = #1e1e2e
surface     = #313244
overlay     = #6c7086
text        = #cdd6f4
lavender    = #b4befe
blue        = #89b4fa
teal        = #94e2d5
green       = #a6e3a1
yellow      = #f9e2af
peach       = #fab387
pink        = #f38ba8
mauve       = #cba6f7

[bar/main]
width = 100%
height = 34
offset-x = 0%
offset-y = 0
radius = 14
fixed-center = true

background = ${colors.base}
foreground = ${colors.text}

border-size = 2
border-color = #313244

padding-left = 2
padding-right = 2
module-margin = 1

; font-0 = text, font-1 = icons (NFM), font-2 = emoji
font-0 = JetBrainsMono NF:style=Regular:size=11;3
font-1 = JetBrainsMono NFM:style=Regular:size=13;3
font-2 = Noto Color Emoji:size=10;3

modules-left   = i3 xwindow
modules-center = date
modules-right  = cpu memory volume battery wlan powermenu

tray-position = none
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-focused = %index%
label-focused-foreground = ${colors.mauve}
label-focused-background = ${colors.surface}
label-focused-underline  = ${colors.mauve}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.overlay}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.blue}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.pink}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.overlay}
format-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a, %d %b
time = %I:%M %p
; %{T2} switches to icon font, %{T-} resets to default font
format = <label>
label = "%{T2}󰥔%{T-}  %date%    %time%"
label-foreground = ${colors.lavender}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = "%{T2}󰻠%{T-} %percentage%%"
label-foreground = ${colors.teal}

[module/memory]
type = internal/memory
interval = 3
format = <label>
label = "%{T2}󰍛%{T-} %percentage_used%%"
label-foreground = ${colors.blue}

[module/volume]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-muted = <label-muted>
label-volume = "%{T2}󰕾%{T-} %percentage%%"
label-volume-foreground = ${colors.yellow}
label-muted = "%{T2}󰝟%{T-} muted"
label-muted-foreground = ${colors.overlay}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 99
poll-interval = 5

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

label-charging = "%{T2}󰂄%{T-} %percentage%%"
label-charging-foreground = ${colors.green}

label-discharging = "%{T2}󰁾%{T-} %percentage%%"
label-discharging-foreground = ${colors.text}

label-full = "%{T2}󰁹%{T-} Full"
label-full-foreground = ${colors.green}

[module/wlan]
type = internal/network
interface = wlo1
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = "%{T2}󰤨%{T-} %essid%"
label-connected-foreground = ${colors.teal}
label-disconnected = "%{T2}󰤭%{T-} offline"
label-disconnected-foreground = ${colors.overlay}

[module/powermenu]
type = custom/text
format = "%{T2}󰐥%{T-}"
format-foreground = ${colors.pink}
click-left = bash /home/alok/.config/eww/scripts/toggle-power.sh
