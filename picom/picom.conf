# ── Shadows ─────────────────────────────────────────────
shadow = true;
shadow-radius = 15;
shadow-opacity = 0.4;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'polybar'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# ── Fading ──────────────────────────────────────────────
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# ── Transparency ────────────────────────────────────────
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "90:class_g = 'Alacritty'",
  "100:class_g = 'firefox'"
];

# ── Blur ────────────────────────────────────────────────
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = true;
blur-kern = "3x3box";
blur-exclude = [
  "class_g = 'slop'"
];

# ── Rounded Corners ─────────────────────────────────────
corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'polybar'"
];

# ── Backend ─────────────────────────────────────────────
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
log-level = "warn";
